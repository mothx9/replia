[package]
name = "replai-c"
version = "0.1.0-dev.0"
edition = "2024"
license = "MIT"
description = "Versioned C binding for the REPLAI terminal interaction library"
repository = "https://github.com/mothx9/replai"
publish = false
build = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
replai = { path = "../.." }
libc = "0.2.189"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"
